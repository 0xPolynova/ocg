databases:
  - name: ocg-db
    plan: free
    databaseName: ocg
    user: ocg

services:
  - type: web
    name: ocg-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npx tsx server/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: OPENROUTER_MODEL
        value: qwen/qwen3-coder-next
      - key: OPENROUTER_CODE_MODEL
        value: qwen/qwen3-coder
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SOLANA_RPC
        sync: false
      - key: CORS_ORIGIN
        value: https://launchocg.com,https://www.launchocg.com,https://ocg-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: ocg-db
          property: connectionString

  - type: web
    name: ocg-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:web
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: API_URL
        value: https://ocg-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://ocg-api.onrender.com
